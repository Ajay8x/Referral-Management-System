<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Shree RBSK</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <main class="login-page">

        <section class="login-card">

            <!-- Brand -->
            <div class="login-brand">

                <div class="brand-logo">
                    R
                </div>

                <div class="brand-info">

                    <h1>
                        Shree RBSK
                    </h1>

                    <p>
                        Referral Management System
                    </p>

                </div>

            </div>


            <!-- Heading -->
            <div class="login-heading">

                <h2>
                    Create Account
                </h2>

                <p>
                    Create your account to manage RBSK referrals and treatment records.
                </p>

            </div>


            <!-- Registration Form -->
            <form id="registerForm">

                <!-- Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Mobile -->
                <div class="form-group">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        inputmode="numeric"
                        maxlength="10"
                        autocomplete="tel"
                        placeholder="Enter 10 digit mobile number"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            minlength="6"
                            autocomplete="new-password"
                            placeholder="Minimum 6 characters"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirm">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirm"
                            name="confirm"
                            minlength="6"
                            autocomplete="new-password"
                            placeholder="Re-enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Message -->
                <div
                    id="msg"
                    class="login-message"
                    aria-live="polite"
                ></div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="login-button"
                >
                    Create Account
                </button>

            </form>


            <!-- Back to Login -->
            <div class="register-section">

                <span>
                    Already have an account?
                </span>

                <a href="index.html">
                    Login
                </a>

            </div>


            <!-- Footer -->
            <div class="login-footer">

                <p>
                    Shree RBSK Referral Management System
                </p>

                <span>
                    Secure • Simple • Mobile Friendly
                </span>

            </div>

        </section>

    </main>


    <script type="module">

        import "./js/auth.js";


        function setupPasswordToggle(
            buttonId,
            inputId
        ) {

            const button =
                document.getElementById(buttonId);

            const input =
                document.getElementById(inputId);

            if (!button || !input) {
                return;
            }

            button.addEventListener(
                "click",
                function () {

                    if (input.type === "password") {

                        input.type = "text";

                        button.textContent = "Hide";

                        button.setAttribute(
                            "aria-label",
                            "Hide password"
                        );

                    } else {

                        input.type = "password";

                        button.textContent = "Show";

                        button.setAttribute(
                            "aria-label",
                            "Show password"
                        );

                    }

                }
            );

        }


        setupPasswordToggle(
            "togglePassword",
            "password"
        );


        setupPasswordToggle(
            "toggleConfirmPassword",
            "confirm"
        );

    </script>

</body>

</html>
