<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shree RBSK | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <!-- Brand -->
            <div class="login-brand">

                <div class="brand-logo">
                    R
                </div>

                <div class="brand-info">
                    <h1>Shree RBSK</h1>
                    <p>Referral Management System</p>
                </div>

            </div>


            <!-- Login Heading -->
            <div class="login-heading">

                <h2>Welcome Back</h2>

                <p>
                    Sign in to manage child referrals and treatment records.
                </p>

            </div>


            <!-- Login Form -->
            <form id="loginForm">

                <!-- Mobile -->
                <div class="form-group">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        inputmode="numeric"
                        maxlength="10"
                        autocomplete="tel"
                        placeholder="Enter 10 digit mobile number"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Error / Status Message -->
                <div
                    id="loginMessage"
                    class="login-message"
                    aria-live="polite"
                ></div>


                <!-- Login Button -->
                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <!-- Forgot Password -->
            <div class="login-links">

                <button
                    type="button"
                    id="forgotPassword"
                    class="link-button"
                >
                    Forgot Password?
                </button>

            </div>


            <!-- Registration -->
            <div class="register-section">

                <span>Don't have an account?</span>

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <!-- Footer -->
            <div class="login-footer">

                <p>
                    Shree RBSK Referral Management System
                </p>

                <span>
                    Secure • Simple • Mobile Friendly
                </span>

            </div>

        </section>

    </main>


    <!-- Authentication Logic -->
    <script type="module" src="js/auth.js"></script>

</body>
</html>
